name: OpsPilot CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backend:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        run: npm install

      - name: Run Test Suite
        run: npm test

  test-demo-service:
    name: Demo Microservice Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./demo-app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: demo-app/package.json

      - name: Install Dependencies
        run: npm install

      - name: Run Microservice Tests
        run: npm test

  build-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm install

      - name: Build Production Assets
        run: npm run build

  validate-k8s-manifests:
    name: Validate Kubernetes & Compose Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Docker Compose
        run: docker compose config -q

      - name: Validate Kubernetes Manifests Syntax
        run: |
          for f in k8s/*.yaml; do
            echo "Checking syntax: $f"
            python3 -c "import yaml; list(yaml.safe_load_all(open('$f')))" || exit 1
          done

