---
# OpsPilot Environment Preparation & System Hardening Playbook
- name: Prepare OpsPilot Cloud-Native Host Environment
  hosts: local
  gather_facts: yes
  vars:
    opspilot_base_dir: "/opt/opspilot"
    opspilot_log_dir: "/var/log/opspilot"
    sysctl_config:
      net.bridge.bridge-nf-call-iptables: 1
      net.bridge.bridge-nf-call-ip6tables: 1
      net.ipv4.ip_forward: 1
      fs.file-max: 2097152
      vm.max_map_count: 262144

  tasks:
    - name: 1. Display Environment Information
      ansible.builtin.debug:
        msg: "Preparing environment on OS {{ ansible_facts['distribution'] | default(ansible_facts['os_family']) }} for OpsPilot Platform"

    - name: 2. Ensure OpsPilot Directory Hierarchy Exists
      become: yes
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ opspilot_base_dir }}"
        - "{{ opspilot_log_dir }}"
        - "{{ opspilot_base_dir }}/configs"
        - "{{ opspilot_base_dir }}/backups"
      ignore_errors: yes

    - name: 3. Configure Container Daemon Log Rotation Policy
      become: yes
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "50m",
              "max-file": "3"
            },
            "default-ulimits": {
              "nofile": {
                "Name": "nofile",
                "Hard": 64000,
                "Soft": 64000
              }
            }
          }
        mode: '0644'
      ignore_errors: yes

    - name: 4. Check Kubernetes Tools Availability
      ansible.builtin.command: "{{ item }} --version"
      register: tool_check
      failed_when: false
      changed_when: false
      check_mode: no
      loop:
        - docker
        - kubectl

    - name: 5. Report Tooling Readiness
      ansible.builtin.debug:
        msg: "Tool {{ item.item }}: {{ 'INSTALLED' if item.rc == 0 else 'NOT DETECTED' }}"
      loop: "{{ tool_check.results }}"

    - name: 6. Verify Kernel Parameters (when running on Linux)
      become: yes
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop: "{{ sysctl_config | dict2items }}"
      when: ansible_facts['os_family'] == 'Debian' or ansible_facts['os_family'] == 'RedHat'
      ignore_errors: yes

    - name: 7. Output Final Status
      ansible.builtin.debug:
        msg: "OpsPilot host preparation playbook completed successfully. Ready for container orchestration."
