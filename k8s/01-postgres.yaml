apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-config
  namespace: opspilot-prod
data:
  POSTGRES_DB: opspilot
  POSTGRES_USER: opspilot_user
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: opspilot-prod
type: Opaque
stringData:
  POSTGRES_PASSWORD: opspilot_secure_password_2026
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-postgres
  namespace: opspilot-prod
  labels:
    app: opspilot-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opspilot-postgres
  template:
    metadata:
      labels:
        app: opspilot-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-init-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-init-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: opspilot-prod
spec:
  selector:
    app: opspilot-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
