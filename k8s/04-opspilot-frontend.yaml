apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-frontend
  namespace: opspilot-prod
  labels:
    app: opspilot-frontend
    tier: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opspilot-frontend
  template:
    metadata:
      labels:
        app: opspilot-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/kavyareddy1313/opspilot-frontend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: opspilot-frontend
  namespace: opspilot-prod
  labels:
    app: opspilot-frontend
spec:
  type: NodePort
  selector:
    app: opspilot-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
      name: http
