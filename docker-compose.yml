version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: opspilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: opspilot_user
      POSTGRES_PASSWORD: opspilot_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/db/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot_user -d opspilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Target Monitored Microservice (Demo App)
  demo-service:
    build:
      context: ./demo-app
      dockerfile: Dockerfile
    container_name: opspilot-demo-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      PORT: 5002
      APP_VERSION: "v1.0.2"
      COMMIT_SHA: "a8f3b21"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3

  # 3. OpsPilot Control Plane & Recovery Engine (Backend API)
  opspilot-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opspilot-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      DATABASE_URL: "postgresql://opspilot_user:opspilot_secure_password_2026@postgres:5432/opspilot"
      DEMO_SERVICE_URL: "http://demo-service:5002"
      PROBE_INTERVAL_MS: 5000
    depends_on:
      postgres:
        condition: service_healthy
      demo-service:
        condition: service_healthy

  # 4. OpsPilot Web Dashboard (Frontend React + Nginx)
  opspilot-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opspilot-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - opspilot-api

  # 5. Prometheus Observability Scraper
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: opspilot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - opspilot-api
      - demo-service

  # 6. Grafana Visual Dashboards
  grafana:
    image: grafana/grafana:10.4.0
    container_name: opspilot-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
